[package]
name = "claude-deck"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1"
dirs = "7"
smol = "2"
signal-hook = "0.4"
raw-window-handle = "0.6"
vtracer = "0.6.5"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "=0.26.0"
# Keychain storage for the Asana token (already in the tree through gpui).
security-framework = "3"

# Local copy of gpui 0.2.2 with fixes marked "Claude Deck patch":
# - vendor/gpui/src/platform/mac/text_system.rs: pad glyph raster bounds 1px
#   (round letters like C lost their left edge).
# - vendor/gpui/src/platform.rs: swap SVG images to BGRA like other images
#   (red and blue were exchanged, so orange icons drew blue).
# - vendor/gpui/src/taffy.rs: f32 literals for a future-incompat warning.
# - vendor/gpui/Cargo.toml: taffy =0.9.2 (was =0.9.0) for grid 1.0, which
#   fixes an integer overflow (GHSA-38c5-483c-4qqp).
# Drop this once an upstream release has these fixes.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
